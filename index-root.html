<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Váltókezelő tanulós</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eceefa;--card:#fff;--ink:#1d1b3a;--mut:#7a7897;--line:#e4e4f2;--acc:#5b4bf0;--acc2:#2aa8f0;--soft:#efeefe;--good:#22a06b;--grad:linear-gradient(135deg,#5b4bf0,#2aa8f0);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15143a;--card:#1f1e4a;--ink:#f1f0ff;--mut:#a7a5cc;--line:#302f63;--soft:#2a2960}}
:root[data-theme="dark"]{--bg:#15143a;--card:#1f1e4a;--ink:#f1f0ff;--mut:#a7a5cc;--line:#302f63;--soft:#2a2960}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
main{max-width:560px;margin:0 auto;padding:0 18px}
section{display:none}section.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px rgba(91,75,240,.3)}
.hello{color:var(--mut);font-size:14px}
.big{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.sub{color:var(--mut);margin:6px 0 18px;font-size:15px}
h2{font-size:19px;font-weight:700;margin:26px 0 10px}
.hero2{position:relative;background:var(--grad);color:#fff;border-radius:24px;padding:22px;overflow:hidden;box-shadow:0 14px 30px rgba(91,75,240,.25)}
.hero2 small{opacity:.85;font-size:13px}
.hero2 h3{font-size:28px;line-height:1.1;font-weight:700;margin:8px 0 8px;max-width:70%}
.hero2 p{margin:0 0 14px;opacity:.9;font-size:14px;max-width:70%}
.cta{font:700 15px "DM Sans",system-ui,sans-serif;background:#fff;color:var(--acc);border:0;border-radius:14px;padding:12px 18px}
.cta.r{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(91,75,240,.3)}
.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.stats{display:flex;gap:10px;margin-top:14px}
.st{flex:1;background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:0 4px 14px rgba(40,40,90,.06)}
.st b{font-size:24px;font-weight:700;display:block;line-height:1.1}
.st span{color:var(--mut);font-size:12px}
.today{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 4px 14px rgba(40,40,90,.06)}
.lamp{width:12px;height:12px;border-radius:50%;flex:none}
.lamp.go{background:var(--good);box-shadow:0 0 0 4px rgba(34,160,107,.18)}
.lamp.stop{background:#e0557a;box-shadow:0 0 0 4px rgba(224,85,122,.18)}
.today b{display:block;font-weight:600;font-size:16px}
.today span{color:var(--mut);font-size:13px}
.steps{display:grid;gap:10px}
.step{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 14px rgba(40,40,90,.06)}
.step em{font-style:normal;color:var(--acc);font-weight:700;margin-right:8px}
.step b{font-weight:600}
.step p{margin:2px 0 0;color:var(--mut);font-size:13px}
.mcal{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 18px rgba(40,40,90,.07);margin:10px 0}
.mcal h3{margin:2px 4px 10px;font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:11px;color:var(--mut);font-weight:600;padding-bottom:4px}
.dc{position:relative;border:0;background:none;border-radius:12px;aspect-ratio:1;font:500 14px "DM Sans",system-ui,sans-serif;color:var(--ink);padding:0}
.dc.off{color:transparent;pointer-events:none}
.dc.none{color:var(--mut);opacity:.5}
.dc.has{background:var(--soft)}
.dc i{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%}
.dc.sel{background:var(--grad);color:#fff}
.dc.sel i{background:#fff!important}
.dc.today{box-shadow:inset 0 0 0 2px var(--acc)}
.dc.done::after{content:"✓";position:absolute;top:2px;right:4px;font-size:9px;color:var(--good);font-weight:700}
.dc.sel.done::after{color:#fff}
.detail{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 6px 18px rgba(40,40,90,.07);display:flex;gap:12px;align-items:center}
.detail .bd b{font-weight:600;font-size:16px;display:block}
.detail .bd span{color:var(--mut);font-size:13px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:17px;flex:none}
.chk.on{background:var(--good);border-color:var(--good)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--acc);margin-left:6px}
.gap{margin:10px 0;padding:10px;text-align:center;color:var(--mut);font-size:13px;background:var(--card);border-radius:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 4px 14px rgba(40,40,90,.06);border-left:6px solid var(--c)}
.card h3{margin:0;font-size:16px;font-weight:600}
.card p{margin:4px 0 10px;color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--grad)}
.btn{font:600 14px "DM Sans",system-ui,sans-serif;padding:9px 14px;border-radius:12px;border:2px solid var(--acc);background:none;color:var(--acc)}
.btn.on{background:var(--grad);border-color:transparent;color:#fff}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.lvl .btn{padding:14px;text-align:left}
.lvl small{display:block;font-weight:400;opacity:.8;margin-top:2px}
.exam{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 4px 14px rgba(40,40,90,.06)}
.exam .num{font-size:40px;font-weight:700;background:var(--grad);-webkit-background-clip:text;color:transparent;min-width:72px;text-align:center}
.exam span{color:var(--mut);font-size:13px}
.qtop{display:flex;justify-content:space-between;align-items:center;padding-top:14px;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);font:600 14px "DM Sans",system-ui,sans-serif;padding:8px 0}
.qq{font-size:22px;line-height:1.25;font-weight:700;margin:16px 0}
.qimg{background:var(--card);border-radius:20px;padding:14px;margin:0 0 12px;text-align:center}
.qimg svg{max-width:100%;height:auto}
.opt{display:block;width:100%;text-align:left;font:500 15px/1.35 "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px;margin:8px 0;box-shadow:0 3px 10px rgba(40,40,90,.05)}
.opt.good{border-color:var(--good);background:rgba(34,160,107,.12)}
.opt.bad{border-color:#e0557a;background:rgba(224,85,122,.12)}
.ans{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;font-size:14px;box-shadow:0 3px 10px rgba(40,40,90,.05)}
.ans small{display:block;color:var(--mut);margin-top:8px}
.hint{color:var(--mut);font-size:13px}
.two{display:flex;gap:10px}.two .btn{flex:1}
.end{text-align:center;padding-top:60px}.end .big{margin-bottom:10px}
.lnk{display:inline-block;text-decoration:none}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(40,40,90,.18)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px "DM Sans",system-ui,sans-serif;padding:8px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:var(--grad);color:#fff}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.wk{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:8px 10px;margin:4px 0 10px;box-shadow:0 4px 14px rgba(40,40,90,.06)}
.wk b{font-size:15px;font-weight:700}
.wk .btn{padding:4px 14px;font-size:18px;line-height:1}
.tt{position:relative;background:var(--card);border-radius:18px;height:660px;overflow:hidden;box-shadow:0 6px 18px rgba(40,40,90,.07)}
.tt .dh{position:absolute;top:0;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-bottom:1px solid var(--line);color:var(--ink)}
.tt .dh small{font-weight:400;color:var(--mut);font-size:11px}
.tt .hl{position:absolute;left:0;width:42px;font-size:11px;color:var(--mut);text-align:center;transform:translateY(-6px)}
.tt .hg{position:absolute;left:42px;right:0;height:1px;background:var(--line)}
.tt .bl{position:absolute;border-radius:10px;color:#fff;padding:6px 7px;font-size:12px;line-height:1.25;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.12);border:0;text-align:left;font-family:"DM Sans",system-ui,sans-serif}
.tt .bl b{display:block;font-size:12px;font-weight:700}
.tt .bl span{display:block;opacity:.92;font-size:11px}
.tt .bl.done{opacity:.6}
.tt .bl.done b::after{content:" ✓"}
</style>
</head>

function until(s){return Math.round((dt(s)-dt(TODAY))/864e5)}
function $(id){return document.getElementById(id)}
function names(r){return r[1].map(function(k){return S[k][0]}).join(", ")}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function lvlQ(){return Q.filter(function(q){return (q.l||1)<=(st.level||1)})}
function ids(f){return lvlQ().filter(function(q){return f(st.q[q.id])})}
var run=null;

function daily(){
  var g=shuf(ids(function(v){return v==="miss"})).concat(shuf(ids(function(v){return !v})),shuf(ids(function(v){return v==="ok"})));
  return g.slice(0,Math.min(st.goal,Q.length));
}
function nextExam(){var e=[["2026-11-19","belső vizsgáig"],["2027-01-25","zárvizsgáig"]].filter(function(x){return until(x[0])>=0})[0];return e}
function renderMa(){
  var cur=null,nx=null;
  D.forEach(function(r){if(r[0]==="gap")return;if(r[0]===TODAY)cur=r;if(!nx&&r[0]>TODAY)nx=r});
  var r=cur||nx,e=nextExam(),ok=ids(function(v){return v==="ok"}).length,miss=ids(function(v){return v==="miss"}).length;
  var t="";
  if(r){var d=dt(r[0]);t='<div class="today"><div class="lamp '+(cur?"go":"stop")+'"></div><div><span>'+(cur?"Ma az órán":"Ma nincs óra, következő nap: "+p2(d.getMonth()+1)+"."+p2(d.getDate())+".")+'</span><b>'+names(r)+'</b><span>'+(r[2]||"időpont nincs megadva")+(r[3]?", "+r[3]:"")+'</span></div></div>'}
  var k=Math.min(st.goal,Q.length);
  $("v-ma").innerHTML='<div class="top"><span>Váltókezelő tanfolyam</span><div class="logo">🚆</div></div>'
  +'<p class="eyebrow">Kevesebb képernyő. Több tudás.</p><h1 class="big">Egy lépéssel közelebb.</h1><p class="sub">Ma is tanulunk valami újat.</p>'
  +'<div class="hero2"><small>A mai kérdéseid</small><h3>'+k+' kérdés, pár perc</h3><p>Jelzési ismeretek a könyvből. Válaszolj, aztán nézd meg a megoldást.</p><div class="meta">F.1 Jelzési utasítás</div>'
  +'<button class="cta" data-go="daily">Kezdem a gyakorlást</button>'
  +'<span class="bubble" style="width:90px;height:90px;right:-18px;top:-22px"></span><span class="bubble" style="width:50px;height:50px;right:70px;bottom:-14px"></span></div>'
  +'<div class="stats"><div class="st"><b>'+(e?until(e[0]):"–")+'</b><span>nap '+(e?e[1]:"")+'</span></div><div class="st"><b>'+ok+'<small style="font-size:14px;color:var(--mut)"> / '+Q.length+'</small></b><span>megtanult kérdés</span></div><div class="st"><b>'+miss+'</b><span>ismétlésre vár</span></div></div>'
  +t+'<h2>Így tanulsz</h2><div class="steps"><div class="step"><em>01</em><b>Olvasd át.</b><p>Az órán és a könyvben a fogalmakat.</p></div><div class="step"><em>02</em><b>Válaszolj.</b><p>Teszt és kártya a napi kérdésekkel.</p></div><div class="step"><em>03</em><b>Ismételd.</b><p>Amit elrontottál, újra előkerül.</p></div></div>';
}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);var k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function renderDays(){
  var BY={};D.forEach(function(r){if(r[0]!=="gap")BY[r[0]]=r});
  var base=st.week?dt(st.week):(st.sel?dt(st.sel):dt(TODAY));
  var mo=mondayOf(base),fr=addDays(mo,4);
  var WN=["Hétfő","Kedd","Szerda","Csütörtök","Péntek"];
  var h='<h2>Órarend</h2><div class="wk"><button class="btn" data-wk="-7">‹</button><b>'+(mo.getMonth()+1)+'. '+mo.getDate()+'. – '+(fr.getMonth()+1)+'. '+fr.getDate()+'.</b><button class="btn" data-wk="7">›</button></div>';
  var col=function(i){return 'left:calc(42px + (100% - 42px) * '+i+' / 5 + 2px);width:calc((100% - 42px) / 5 - 4px)'};
  h+='<div class="tt">';
  for(var t=8;t<=17;t++){var top=(t*60-480);h+='<div class="hl" style="top:'+(top+34)+'px">'+t+':00</div><div class="hg" style="top:'+(top+34)+'px"></div>'}
  for(var i=0;i<5;i++){var dd=addDays(mo,i),k=key(dd);h+='<div class="dh" style="'+col(i)+';left:calc(42px + (100% - 42px) * '+i+' / 5);width:calc((100% - 42px) / 5)"><span>'+WN[i]+'</span><small>'+(dd.getMonth()+1)+'. '+dd.getDate()+'.</small></div>'}
  for(var i2=0;i2<5;i2++){
    var dd2=addDays(mo,i2),k2=key(dd2),r=BY[k2];
    if(!r)continue;
    var se=r[2].split("–");if(se.length<2)continue;
    var sm=se[0].split(":"),em=se[1].split(":");
    var a=(+sm[0])*60+(+sm[1])-480,b=(+em[0])*60+(+em[1])-480;
    var c=S[r[1][0]][1],names2=names(r);
    h+='<button class="bl'+(st.d[k2]?" done":"")+'" data-sel="'+k2+'" style="'+col(i2)+';top:'+(a+34)+'px;height:'+(b-a-2)+'px;background:'+c+'"><b>'+names2+'</b><span>'+se[0]+'–'+se[1]+'</span>'+(r[3]?'<span>'+r[3]+'</span>':'')+(r[4]?'<span>'+r[4]+'</span>':'')+'</button>';
  }
  h+='</div>';
  var sel=st.sel&&BY[st.sel]?st.sel:null;
  if(sel){var r3=BY[sel],on=st.d[sel],dd3=dt(sel);
    h+='<div class="detail" style="border-left:6px solid '+S[r3[1][0]][1]+'"><div class="bd"><span>'+WD[dd3.getDay()]+', '+(dd3.getMonth()+1)+'. '+dd3.getDate()+'.</span><b>'+names(r3)+'</b><span>'+r3[2]+(r3[3]?", "+r3[3]:"")+'</span></div><button class="chk'+(on?" on":"")+'" data-day="'+sel+'" aria-label="Átvettem">'+(on?"✓":"")+'</button></div>';
  }
  $("v-nap").innerHTML=h;
}
function key(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function renderRep(){
  var m=ids(function(v){return v==="miss"});
  var h='<h2>Ismétlés</h2>';
  if(!m.length)h+='<p class="sub">Még nincs ismétlésre váró kérdés. Amit elrontasz, itt gyűlik, és újra feldobom.</p>';
  else{h+='<p class="sub">'+m.length+' kérdés vár ismétlésre.</p><button class="cta r" data-go="rep">Ismétlem</button><div style="margin-top:16px">';
    m.forEach(function(q){h+='<div class="step"><b>'+q.q+'</b></div>'});h+='</div>'}
  $("v-rep").innerHTML=h;
}
function renderHal(){
  var ok=ids(function(v){return v==="ok"}).length,h='<h2>Vizsgák</h2>';
  [["2026-11-19","Belső vizsga","08:55–14:15"],["2027-01-25","Zárvizsga","10:00–15:20"]].forEach(function(e){
    var u=until(e[0]),d=dt(e[0]);
    h+='<div class="exam"><div class="num">'+(u<0?"–":u)+'</div><div><b>'+e[1]+'</b><br><span>'+(u<0?"már lezajlott":u===0?"ma van":"nap van hátra")+', '+MON[d.getMonth()]+' '+d.getDate()+'., '+e[2]+'</span></div></div>'});
  h+='<h2>Kérdések</h2><div class="bar"><i style="width:'+(100*ok/Q.length)+'%"></i></div><span class="hint">'+ok+' / '+Q.length+' kérdést tudsz</span><h2>Tantárgyak</h2>';
  STUDY.forEach(function(k){
    var c=D.filter(function(r){return r[0]!=="gap"&&r[1].indexOf(k)>-1}).length,on=st.s[k];
    h+='<div class="card" style="--c:'+S[k][1]+'"><h3>'+S[k][0]+'</h3><p>'+c+' oktatási nap</p><button class="btn'+(on?" on":"")+'" data-sub="'+k+'">'+(on?"Átvettem ✓":"Megjelölöm átvettnek")+'</button></div>'});
  $("v-hal").innerHTML=h+setHtml();
}
function setHtml(){
  return '<h2>Szint</h2><div class="lvl"><button class="btn'+(st.level===1?" on":"")+'" data-lvl="1">Kezdő<small>alap fogalmak</small></button><button class="btn'+(st.level===2?" on":"")+'" data-lvl="2">Haladó<small>minden kérdés</small></button></div>'
  +'<h2>Napi kérdések</h2><div class="two"><button class="btn'+(st.goal===5?" on":"")+'" data-goal="5">5</button><button class="btn'+(st.goal===10?" on":"")+'" data-goal="10">10</button></div>'
  +'<p class="hint" style="margin-top:20px">A haladásod ezen a telefonon, a böngészőben tárolódik. Ha törlöd a böngészőadatokat, elvész.</p><button class="btn" data-reset="1" style="margin-top:8px">Haladás törlése</button>';
}
var BOOKS=[
{n:"F.1 Jelzési utasítás",p:175,k:"Jelzési ismeretek",w:"Írásbeli 4 kérdés, szóbeli 3",id:"F1-jelzesi-utasitas.pdf"},
{n:"F.2 Forgalmi utasítás",p:281,k:"Forgalmi ismeretek",w:"Írásbeli 5 kérdés, szóbeli 4",id:"F2-forgalmi-utasitas.pdf"},
{n:"F.2 Forgalmi utasítás függelékei",p:108,k:"Forgalmi ismeretek",w:"Írásbeli 1 kérdés, szóbeli 1",id:"F2-fuggelekek.pdf"},
{n:"E.2 Fékutasítás",p:86,k:"A járművek, vonatok fékberendezései",w:"Írásbeli 1 kérdés",id:"E2-fekutasitas.pdf"},
{n:"E.12 Műszaki kocsi- és vonatvizsgálatok",p:222,k:"Általános vontatott jármű ismeretek",w:"Írásbeli 1 kérdés",id:"E12-kocsivizsgalat.pdf"},
{n:"E.101 Villamosított vonalak üzeme",p:74,k:"E.101",w:"A vizsgaleírásban nem szerepel",id:"E101-villamositott-vonalak.pdf"}];
function renderBk(){
  var h='<h2>Könyvek</h2><p class="sub">Mind a hat a 2023. április 1-jétől hatályos egységes szerkezetben.</p>';
  BOOKS.forEach(function(b){h+='<div class="card" style="--c:var(--red)"><h3>'+b.n+'</h3><p>'+b.k+', '+b.p+' oldal. '+b.w+'.</p>'+'<a class="btn on lnk" href="'+b.id+'" target="_blank" rel="noopener">Megnyitás</a>'+'</div>'});
  $("v-bk").innerHTML=h;
}
function renderAll(){renderMa();renderDays();renderBk();renderRep();renderHal()}
function show(v){
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===v)});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});
  $("nav").style.display=v==="v-quiz"?"none":"flex";
  window.scrollTo(0,0);
  if(v==="v-nap"){var x=$("next");if(x)x.scrollIntoView({block:"center"})}
}
function start(list){if(!list.length)return;run={q:list,i:0,ok:0,picked:null,shown:false};show("v-quiz");renderQ()}
function renderQ(){
  var el=$("v-quiz");
  if(run.i>=run.q.length){el.innerHTML='<div class="end"><div class="big">'+run.ok+' / '+run.q.length+'</div><p class="sub">'+(run.ok===run.q.length?"Hibátlan. Szép munka.":"A hibás kérdések az Ismétlés fülön várnak.")+'</p><button class="cta r" data-exit="1">Vissza</button></div>';return}
  var q=run.q[run.i],h='<div class="qtop"><button class="x" data-exit="1">Kilépés</button><span>'+(run.i+1)+' / '+run.q.length+'</span></div><div class="bar"><i style="width:'+(100*run.i/run.q.length)+'%"></i></div><h2 class="qq">'+q.q+'</h2>';
  if(q.t==="card"){
    if(!run.shown)h+='<button class="cta r" data-show="1">Mutasd a választ</button><p class="hint">Mondd el hangosan a saját szavaiddal, aztán nézd meg.</p>';
    else h+='<div class="ans">'+q.a+'<small>Könyv: '+q.src+'</small></div><div class="two"><button class="btn" data-grade="0">Nem tudtam</button><button class="btn on" data-grade="1">Tudtam</button></div>';
  }else{
    var o=q.t==="tf"?["Igaz","Hamis"]:q.o;
    o.forEach(function(t,i){var c="opt";if(run.picked!==null){if(i===q.a)c+=" good";else if(i===run.picked)c+=" bad"}h+='<button class="'+c+'" '+(run.picked===null?'data-a="'+i+'"':"disabled")+'>'+t+'</button>'});
    if(run.picked!==null)h+='<div class="ans">'+q.e+'</div><button class="cta r" data-next="1">Következő</button>';
  }
  el.innerHTML=h;
}
function rec(q,ok){st.q[q.id]=ok?"ok":"miss";if(ok)run.ok++;save()}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset,q;
  if(d.v){show(d.v)}
  else if(d.sel){st.sel=d.sel;st.week=d.sel;save();renderDays()}
  else if(d.wk){var nb=addDays(mondayOf(st.week?dt(st.week):dt(TODAY)),+d.wk);st.week=key(nb);save();renderDays()}
  else if(d.lvl){st.level=+d.lvl;save();renderHal();renderMa()}
  else if(d.day){st.d[d.day]=!st.d[d.day];save();var y=window.scrollY;renderDays();window.scrollTo(0,y)}
  else if(d.sub){st.s[d.sub]=!st.s[d.sub];save();var y2=window.scrollY;renderHal();window.scrollTo(0,y2)}
  else if(d.go==="daily"){start(daily())}
  else if(d.go==="rep"){start(shuf(ids(function(v){return v==="miss"})))}
  else if(d.a!==undefined){q=run.q[run.i];run.picked=+d.a;rec(q,+d.a===q.a);renderQ()}
  else if(d.show){run.shown=true;renderQ()}
  else if(d.grade){rec(run.q[run.i],d.grade==="1");run.i++;run.shown=false;run.picked=null;renderQ()}
  else if(d.next){run.i++;run.shown=false;run.picked=null;renderQ()}
  else if(d.exit){run=null;renderAll();show("v-ma")}
  else if(d.goal){st.goal=+d.goal;save();renderHal();renderMa()}
  else if(d.reset){if(b.dataset.sure){st={d:{},s:{},q:{},goal:10};save();renderAll();b.textContent="Törölve";delete b.dataset.sure}else{b.dataset.sure="1";b.textContent="Biztosan? Koppints újra"}}
});
renderAll();
</script>
</body>
</html>
